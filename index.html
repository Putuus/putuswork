<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f1fc" />
    <title>工时记录 · Worklog</title>
    <meta name="description" content="本地优先的工时记录与工资计算工具：日历记工、餐补、批量录入、统计图表。" />
    <link rel="icon" type="image/png" href="./logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 提前定好主题，避免深色模式下首帧闪一下白
      (function () {
        try {
          var raw = localStorage.getItem('worklog:v1');
          var theme = raw ? (JSON.parse(raw).settings || {}).theme : 'light';
          if (theme === 'auto' || !theme) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
        } catch (err) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
